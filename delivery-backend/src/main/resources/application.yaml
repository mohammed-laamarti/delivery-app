server:
  port: ${PORT:8080}

spring:
  application:
    name: delivery-app
  jackson:
    time-zone: Africa/Casablanca
  datasource:
    url: ${DELIVERY_DB_URL:jdbc:postgresql://localhost:5432/deliverydb}
    username: ${DELIVERY_DB_USERNAME:delivery_user}
    password: ${DELIVERY_DB_PASSWORD:delivery_password}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Africa/Casablanca
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:delivery-app-development-secret-key-change-me-2026}
    jwt-expiration-ms: 28800000
  bootstrap:
    admin-phone: ${APP_BOOTSTRAP_ADMIN_PHONE:0600000000}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}
